# .github/workflows/deploy_with_terraform.yml
name: Deploy Frontend and Backend with Terraform

on:
  push:
    branches: [main]
    
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: "24"
  AWS_REGION: "us-east-1"
  FRONTEND_BUILD_DIR: ".next"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
  
  # Build and test frontend in dev environment (always runs for main pushes)
  build-frontend-dev:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Add AWS credential setup for dev environment builds too
      - name: Configure AWS Credentials (if needed)
        if: env.CI == 'true' || github.event.inputs.environment != 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache dependencies and build cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ${{ env.FRONTEND_BUILD_DIR }}/.next/cache
          key: ${{ runner.os }}-frontend-${{ hashFiles('./frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: npm ci

      # Build and upload in single step for simplicity (fixes sitemap issue)
      - name: Build, Generate Sitemap, and Upload Frontend
        id: build-frontend
        env:
          ENVIRONMENT: dev  # Hardcoded to dev for this job
        run: |
          echo "Building Next.js app..."
          
          cd ../frontend && npm ci && \
            npm run build || {
              echo "::warning::Build failed but continuing with existing artifacts"
            }

          # Get or create the frontend bucket name
          FRONTEND_BUCKET="${TERRAFORM_STATIC_BUCKET:-personal-website-stack-${ENVIRONMENT}-frontend-bucket}"
          
          if [ -d "$FRONTEND_BUILD_DIR" ]; then
            echo "Uploading to S3..."
            
            # Ensure cleanup of old build artifacts (prevents stale file uploads)
            # rm -rf $FRONTEND_BUILD_DIR # DELETES ALL FILES BEFORE UPLOAD
            
            aws s3 sync \
              ../frontend/$FRONTEND_BUILD_DIR \
              s3://$FRONTEND_BUCKET --delete \
              --exclude "*.bak" \
              --exclude ".next/*" || {
              echo "::error::Failed to upload frontend build to S3"
              exit 1
            }

            # Verify upload was successful
            aws s3 ls s3://$FRONTEND_BUCKET/ | head -5 || true
          fi
      
      - name: Run frontend tests (optional)
        run: npm test -- --coverage --watchAll=false

  deploy-backend-terraform-dev:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend-dev]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    defaults:
      run:
        working-directory: ./terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      # Initialize Terraform (this will also handle backend config)
      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      # Plan and apply (adds safety for production)
      - name: Terraform Plan (Review Changes)
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          
          terraform plan \
            -var-file="./${ENVIRONMENT}.tfvars" \
            -out=tfplan || {
            echo "::error::Terraform plan failed, aborting deployment"
            exit 1
          }

      # Only apply to dev/staging (require manual approval for prod)
      - name: Apply Terraform Backend Resources
        if: env.CI == 'true' || github.event.inputs.environment != 'prod'
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          
          terraform apply \ 
            -input=false \ 
            tfplan

      # Extract outputs for verification (optional)
      - name: Get Stack Outputs from Terraform
        id: get-outputs
        run: |
          FRONTEND_BUCKET=$(terraform output -raw FrontendBucketName 2>/dev/null || echo "")
          CLOUDFRONT_ID=$(terraform output -raw CloudFrontDistributionId 2>/dev/null || echo "")

          if [ -n "$FRONTEND_BUCKET" ]; then
            echo "frontend-bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
            echo "cloudfront-id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT
          fi

  build-frontend-staging:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'staging'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        if: env.CI == 'true' || github.event.inputs.environment != 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Upload Frontend to Staging S3 Bucket
        id: build-frontend-staging
        run: |
          ENVIRONMENT="staging"
          
          echo "Building frontend..."
          cd ../frontend && npm ci && \
            npm run build || {
              echo "::warning::Build failed, using previous artifacts"
            }

          FRONTEND_BUCKET="${TERRAFORM_STATIC_BUCKET:-personal-website-stack-${ENVIRONMENT}-frontend-bucket}"
          
          if [ -d ".next" ]; then
            rm -rf .next  # Cleanup before upload
            
            aws s3 sync \
              ../frontend/.next \
              s3://$FRONTEND_BUCKET --delete \
              --exclude "*.bak" || {
              echo "::error::Failed to upload frontend build to staging S3 bucket"
            }
          fi

  deploy-backend-terraform-staging:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'staging'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan (Staging)
        run: |
          ENVIRONMENT="staging"
          
          terraform plan \
            -var-file="./${ENVIRONMENT}.tfvars" \
            -out=tfplan || {
            echo "::error::Terraform plan failed, aborting deployment"
            exit 1
          }

      # Auto-approve staging (require manual approval for prod)
      - name: Apply Terraform Backend Resources to Staging
        if: env.CI == 'true' || github.event.inputs.environment != 'prod'
        run: |
          ENVIRONMENT="staging"
          
          terraform apply \
            tfplan \
            -auto-approve \
            -input=false

  build-frontend-prod:
    runs-on: ubuntu-latest  # Fixed the typo from "ubuntu latest" to "ubuntu-latest"
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'prod'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Require manual approval for production deployments
      - name: Require Manual Approval for Production Deployment
        run: |
          echo "Production deployment requires manual approval via GitHub Actions"
          echo "This workflow will NOT auto-apply changes in production environment."
          exit 1

  deploy-backend-terraform-prod:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'prod'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # This job will only run IF the prod build succeeds (which it won't due to exit 1)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      # For production: require explicit approval via GitHub Actions manual trigger
      # OR add a step that requires input confirmation before running apply