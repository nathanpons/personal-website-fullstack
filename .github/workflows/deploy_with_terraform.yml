# .github/workflows/deploy_with_terraform.yml
name: Deploy Frontend and Backend with Terraform

on:
  # Trigger on main branch pushes (change this to your branches)
  push:
    branches: [main]
    
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  NODE_VERSION: "24"
  AWS_REGION: "us-east-1"
  
  # Frontend build directory (change if using different output)
  FRONTEND_BUILD_DIR: ".next"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
  
  # Build and test frontend in dev environment (always runs for main pushes)
  build-frontend-dev:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache dependencies and build cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ${{ env.FRONTEND_BUILD_DIR }}/.next/cache
          key: ${{ runner.os }}-frontend-${{ hashFiles('./frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: npm ci

      # Generate and test sitemap (optional, happens during build)
      - name: Build frontend with sitemap generation
        id: build-frontend
        run: |
          echo "Building Next.js app..."
          npm run build || {
            echo "::warning::Build failed but continuing to upload existing artifacts"
          }

          # Upload built files (if build succeeded)
          if [ -d "${FRONTEND_BUILD_DIR}" ]; then
            FRONTEND_BUCKET="${TERRAFORM_STATIC_BUCKET:-personal-website-stack-dev-frontend-bucket}"
            
            echo "Uploading to S3..."
            aws s3 sync \
              $FRONTEND_BUILD_DIR \
              s3://$FRONTEND_BUCKET --delete \
              --exclude "*.bak" \
              --exclude ".next/*" || {
              echo "::error::Failed to upload frontend build to S3"
            }
          fi

      - name: Run frontend tests (optional)
        run: npm test -- --coverage --watchAll=false

  # Deploy backend via Terraform in dev environment
  deploy-backend-terraform:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend-dev]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      # Check if we need to apply (only on main branch or manual dispatch)
      - name: Apply Terraform Backend Resources
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          
          terraform apply \
            -var-file="./${ENVIRONMENT}.tfvars" \
            -auto-approve \
            -input=false

      # Extract outputs for verification (optional)
      - name: Get Stack Outputs from Terraform
        id: get-outputs
        run: |
          FRONTEND_BUCKET=$(terraform output -raw FrontendBucketName)
          CLOUDFRONT_ID=$(terraform output -raw CloudFrontDistributionId)

          echo "frontend-bucket=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront-id=$CLOUDFRONT_ID" >> $GITHUB_OUTPUT

  # Deploy frontend to staging environment (when on main branch + manual trigger)
  deploy-frontend-staging:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'staging'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build and Upload Frontend to Staging S3 Bucket
        id: build-frontend-staging
        env:
          ENVIRONMENT: staging
          BUILD_DIR: .next
        run: |
          # Set environment variable for bucket naming (change if needed)
          FRONTEND_BUCKET="${TERRAFORM_STATIC_BUCKET:-personal-website-stack-${ENVIRONMENT}-frontend-bucket}"
          
          echo "Building frontend..."
          cd ../frontend && npm ci && npm run build || {
            echo "::warning::Build failed, using previous artifacts"
          }

          # Upload to S3 bucket (if directory exists)
          if [ -d "$BUILD_DIR" ]; then
            aws s3 sync \
              $BUILD_DIR \
              s3://$FRONTEND_BUCKET --delete \
              --exclude "*.bak" || {
            echo "::error::Failed to upload frontend build to staging S3 bucket"
          }
          fi

  # Deploy backend to staging environment (when on main branch + manual trigger)
  deploy-backend-staging:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend-dev]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'staging'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Apply Terraform Backend Resources to Staging
        run: |
          ENVIRONMENT="staging"
          
          terraform apply \
            -var-file="./${ENVIRONMENT}.tfvars" \
            -auto-approve \
            -input=false

  # Deploy frontend to prod environment (only on main branch + manual trigger)
  deploy-frontend-prod:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'prod'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build and Upload Frontend to Production S3 Bucket
        id: build-frontend-prod
        env:
          ENVIRONMENT: prod
          BUILD_DIR: .next
        run: |
          FRONTEND_BUCKET="${TERRAFORM_STATIC_BUCKET:-personal-website-stack-${ENVIRONMENT}-frontend-bucket}"
          
          echo "Building frontend..."
          cd ../frontend && npm ci && npm run build || {
            echo "::warning::Build failed, using previous artifacts"
          }

          # Upload to production S3 bucket (if directory exists)
          if [ -d "$BUILD_DIR" ]; then
            aws s3 sync \
              $BUILD_DIR \
              s3://$FRONTEND_BUCKET --delete \
              --exclude "*.bak" || {
            echo "::error::Failed to upload frontend build to production S3 bucket"
          }
          fi

  # Deploy backend to prod environment (only on main branch + manual trigger)
  deploy-backend-prod:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend-dev]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'prod'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Apply Terraform Backend Resources to Production
        run: |
          ENVIRONMENT="prod"
          
          terraform apply \
            -var-file="./${ENVIRONMENT}.tfvars" \
            -auto-approve \
            -input=false